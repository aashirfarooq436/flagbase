packages:
  - "apps/*"
  - "packages/*"
# pnpm blocks postinstall scripts by default as a supply-chain guard.
# esbuild is vitest's own dependency and needs its script to fetch/build a native binary.
allowBuilds:
  esbuild: true
  # argon2 is a native addon and compiles on install.
  argon2: true
  # mongodb-memory-server's postinstall can pre-fetch the Mongo binary.
  mongodb-memory-server: true
  # sharp is Next.js's image optimizer; its install script selects the platform binary.
  sharp: true
  # unrs-resolver is a native resolver pulled in by the ESLint import tooling.
  unrs-resolver: true
